# TEMPORARILY PAUSED: open-pull-requests-limit is 0 on every ecosystem, which
# stops Dependabot opening new version-update PRs (existing ones stay open;
# security-alert updates are unaffected). Paused deliberately while other work
# is in flight — restore the limits to resume.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0 # paused (was 10)
    labels: ["dependencies"]
    commit-message: { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0 # paused
    labels: ["dependencies", "ci"]
    commit-message: { prefix: "chore(ci)" }
  - package-ecosystem: docker
    directories:
      - "/modules/custom-domains/controller"
      - "/modules/prefect/workers/prefect"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0 # paused
    labels: ["dependencies", "docker"]
    commit-message: { prefix: "chore(docker)" }

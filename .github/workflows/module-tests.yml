name: Module tests

# Runs each module's own vitest suite (`pnpm -r --if-present test`). Before this,
# gatewaze-modules CI was only gitleaks + CodeQL, so module unit tests never ran
# — warehouse-sync's sql-gen suite sat broken (a stale import + a fixture gap)
# unnoticed. This surfaces those regressions.
#
# NON-BLOCKING for now (continue-on-error): a few modules' suites still need
# their dev deps sorted in a clean CI install before the whole set is reliably
# green. Once `pnpm -r --if-present test` passes end-to-end here, drop the
# continue-on-error and add "Module tests" to the branch's required checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  module-tests:
    name: Module tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Run module test suites
        run: pnpm -r --if-present test

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; }
  #card {
    /* ------- COLORWAY (overridden from {{brand.*}} by the script below) */
    --accent:#0E79FD; --accent-bright:#7DB6FF; --accent-dark:#0A50B8; --wave-from:#00A6A5;
    background:#020204;
    font-family:'Red Hat Display',sans-serif;
    color:#fff; overflow:hidden; position:relative; transform-origin:top left;
  }
  .ambient { position:absolute; border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 21%, transparent) 0%, color-mix(in srgb, var(--accent) 7%, transparent) 38%, transparent 65%); }
  .wave, .streaks { position:absolute; pointer-events:none; }
  .masthead img.lockup { display:block; }
  .speaker-chip { font-weight:800; letter-spacing:.34em; color:#fff;
    border:2px solid var(--accent);
    background:var(--accent);
    box-shadow:0 0 30px color-mix(in srgb, var(--accent) 45%, transparent); }
  .name { font-weight:900; letter-spacing:-0.01em; line-height:1.04; color:#fff; }
  .role { font-weight:500; color:rgba(255,255,255,.82); }
  .company { font-weight:700; color:var(--accent-bright); }
  .talk { font-weight:600; font-style:italic; color:rgba(255,255,255,.75); }
  .bubble-wrap { perspective:850px; perspective-origin:35% 45%; }
  .b3d { position:relative; transform-style:preserve-3d; transform:rotateY(-32deg) rotateX(9deg) rotate(1deg); }
  .bback { position:absolute; inset:0; transform:translateZ(-26px);
    filter:drop-shadow(0 0 34px color-mix(in srgb, var(--accent) 60%, transparent)); }
  .bfront { position:relative;
    filter:drop-shadow(0 0 40px color-mix(in srgb, var(--accent) 45%, transparent)); }
  .footer { position:absolute; display:flex; border-left:3px solid rgba(255,255,255,.85); }
  .frow { display:flex; align-items:center; }
  .icon-box { display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .ftext { font-weight:800; color:#fff; white-space:nowrap; }
  .aaif { position:absolute; display:flex; align-items:center; }
  .aaif-text { font-weight:700; color:#fff; line-height:1.15; }

  #card { width:1200px; height:630px; }

  .ambient { right:-260px; top:50%; transform:translateY(-50%); width:950px; height:950px; }
  .masthead { position:absolute; top:56px; left:64px; }
  .masthead img.lockup { width:360px; }
  .speaker-chip { display:inline-block; font-size:18px; border-radius:9px; padding:10px 13px 10px 20px; margin-bottom:24px; }
  .nameblock { position:absolute; left:64px; top:168px; max-width:620px; }
  .talk { font-size:22px; margin-top:14px; }
  .name { font-size:56px; } .role { font-size:25px; margin-top:12px; } .company { font-size:28px; margin-top:6px; }
  .bubble-wrap { position:absolute; right:110px; top:64px; }
  .footer { left:64px; bottom:52px; }
  .icon-box { width:36px; height:36px; margin-right:12px; }
  .ftext { font-size:22px; letter-spacing:.16em; }
  .footer .frow + .frow { margin-left:34px; }
  .aaif { right:64px; bottom:44px; gap:13px; }

</style>

    window.CARD_W = CARD_W; window.CARD_H = CARD_H;
    window.addEventListener('resize', fit); fit();
  })();
</script>
